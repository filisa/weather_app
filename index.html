<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>

		<meta name="description" content="Weather app homepage" />
		<link rel="stylesheet" href="styles.css" />
		<link rel="icon" href="images/cloudy.svg" />
		<link rel="preload" href="images/progress.svg" as="image" />
		<script type="module" src="script.js" defer></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bellota:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<main>
			<h1>Weather app</h1>
			<image class="loader" id="loader" src="images/progress.svg"></image>
			<div class="dropdown" id="dropdown">
				<input
					autofocus
					class="input"
					id="input_field"
					type="text"
					placeholder="🔎 Choose your city"
				/>
				<div
					class="dropdown_suggestions_div"
					id="dropdown_suggestions_div"
				></div>
			</div>
			<div id="weather_div" class="weather_div">
				<div id="weather_condition" class="card"></div>
				<div id="temperature" class="card"></div>
				<div id="wind" class="card"></div>
			</div>
			<p id="text"></p>
			<p id="short_description"></p>
		</main>
		<footer>Made by © Margarita Nikulina | 2026</footer>
	</body>
</html>
