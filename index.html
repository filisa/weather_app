<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>

		<meta name="description" content="Weather app homepage" />
		<link rel="stylesheet" href="styles.css" />
		<link rel="icon" href="images/cloudy.svg" />
		<script type="module" src="script.js" defer></script>
		<script type="text/javascript" src="codes.json"></script>
	</head>
	<body>
		<main>
			<h1>Weather App</h1>
			<div class="dropdown" id="dropdown">
				<input
					autofocus
					class="input"
					id="input_field"
					type="text"
					placeholder="🔎 Choose your city"
				/>
			</div>
			<button id="search">Search</button>
			<p id="text"></p>
			<p id="short_description"></p>
			<div id="weather_div" class="weather_div">
				<div id="weather_condition" class="card"></div>
				<div id="temperature" class="card"></div>
				<div id="wind" class="card"></div>
			</div>
		</main>
		<footer>Made by © Margarita Nikulina | 2026</footer>
	</body>
</html>
